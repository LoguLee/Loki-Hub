<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loki | DevOps Learner</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 255, 170, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(0, 140, 255, 0.12),
                    transparent 30%
                ),
                #05080d;

            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND GRID
        ========================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );

            pointer-events: none;
        }

        /* =========================
           GLOWING ORBS
        ========================= */

        .orb {

            position: fixed;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.25;

            pointer-events: none;
        }

        .orb-one {

            width: 250px;
            height: 250px;

            background: #00ffaa;

            top: -80px;
            left: -80px;
        }

        .orb-two {

            width: 300px;
            height: 300px;

            background: #0077ff;

            right: -100px;
            bottom: -100px;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {

            position: relative;

            z-index: 10;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 25px 7%;

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            background:
                rgba(5,8,13,0.55);

            backdrop-filter: blur(15px);
        }

        .logo {

            font-family: monospace;

            font-size: 20px;

            font-weight: bold;

            color: #00ffaa;

            letter-spacing: 2px;
        }

        .logo span {

            color: white;
        }

        nav a {

            color: #aeb9c5;

            text-decoration: none;

            margin-left: 25px;

            transition: 0.3s;
        }

        nav a:hover {

            color: #00ffaa;
        }

        /* =========================
           HERO
        ========================= */

        .hero {

            min-height: calc(100vh - 80px);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px 20px;

            position: relative;

            z-index: 2;
        }

        .terminal-tag {

            font-family: monospace;

            color: #00ffaa;

            font-size: 15px;

            margin-bottom: 25px;

            padding: 10px 18px;

            border:
                1px solid rgba(0,255,170,0.25);

            border-radius: 30px;

            background:
                rgba(0,255,170,0.05);

            box-shadow:
                0 0 25px rgba(0,255,170,0.08);
        }

        .hero h1 {

            font-size: clamp(55px, 9vw, 110px);

            line-height: 1;

            letter-spacing: -3px;

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #00ffaa
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .hero h2 {

            font-size: clamp(20px, 3vw, 30px);

            font-weight: 400;

            color: #c4ced8;

            margin-bottom: 20px;
        }

        .hero p {

            max-width: 650px;

            color: #8794a2;

            font-size: 17px;

            line-height: 1.8;

            margin-bottom: 35px;
        }

        /* =========================
           BUTTON
        ========================= */

        .button {

            display: inline-block;

            padding: 15px 30px;

            border-radius: 8px;

            border:
                1px solid #00ffaa;

            color: #00ffaa;

            text-decoration: none;

            font-weight: bold;

            font-family: monospace;

            letter-spacing: 1px;

            background:
                rgba(0,255,170,0.06);

            transition: 0.3s;
        }

        .button:hover {

            background: #00ffaa;

            color: #04100c;

            transform: translateY(-4px);

            box-shadow:
                0 10px 35px rgba(0,255,170,0.3);
        }

        /* =========================
           DEVOPS PIPELINE
        ========================= */

        .pipeline {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 0;

            margin-top: 70px;

            flex-wrap: wrap;
        }

        .pipeline-step {

            padding: 12px 18px;

            border:
                1px solid rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.04);

            color: #b8c3ce;

            font-family: monospace;

            font-size: 13px;

            backdrop-filter: blur(10px);
        }

        .pipeline-arrow {

            color: #00ffaa;

            padding: 0 8px;

            font-family: monospace;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {

            position: relative;

            z-index: 2;

            text-align: center;

            padding: 25px;

            color: #56616d;

            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {

                padding: 20px;
            }

            nav div:last-child {

                display: none;
            }

            .hero {

                min-height: calc(100vh - 70px);

            }

            .hero h1 {

                letter-spacing: -1px;
            }

            .hero p {

                font-size: 15px;
            }

            .pipeline {

                margin-top: 45px;

                gap: 8px;
            }

            .pipeline-arrow {

                display: none;
            }

            .pipeline-step {

                margin: 4px;
            }

        }

    </style>

</head>


<body>

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>


    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            &lt;LOKI<span>/DEVOPS&gt;</span>
        </div>

        <div>

            <a href="#about">About</a>

            <a href="#learning">Learning</a>

            <a href="#contact">Contact</a>

        </div>

    </nav>


    <!-- HERO -->

    <main class="hero">

        <div class="terminal-tag">
            $ whoami
        </div>

        <h1>LOKI</h1>

        <h2>DevOps Learner & Technology Enthusiast</h2>

        <p>
            Exploring Linux, Git, GitHub, CI/CD, Docker,
            Kubernetes, Cloud, Infrastructure as Code
            and modern DevOps practices.
        </p>

        <a href="#learning" class="button">
            ./explore.sh
        </a>


        <!-- DEVOPS PIPELINE -->

        <div class="pipeline">

            <div class="pipeline-step">
                Git
            </div>

            <div class="pipeline-arrow">
                →
            </div>

            <div class="pipeline-step">
                CI/CD
            </div>

            <div class="pipeline-arrow">
                →
            </div>

            <div class="pipeline-step">
                Docker
            </div>

            <div class="pipeline-arrow">
                →
            </div>

            <div class="pipeline-step">
                Kubernetes
            </div>

            <div class="pipeline-arrow">
                →
            </div>

            <div class="pipeline-step">
                Cloud
            </div>

        </div>

    </main>


    <footer>

        Building. Learning. Automating.

    </footer>


</body>

</html>
